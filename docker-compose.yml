# Development stack: builds the image locally and bind-mounts the UI + prompts so
# edits are live. For deploying the PUBLISHED image see docker-compose.prod.yml.
#
# Pin the project name so container/command names don't depend on the folder.
name: bouncer

services:
  # One self-contained container: Ollama + the Bouncer API + demo UI.
  bouncer:
    build: .
    image: bouncer
    container_name: bouncer
    init: true # reap zombies + let the entrypoint's SIGTERM handler run
    environment:
      # Ollama tags, pulled automatically at boot. Pull more later with:
      #   make pull MODEL=<tag>
      DESCRIBER_MODEL: ${DESCRIBER_MODEL:-gemma4:e2b} # stage 1 — MUST support vision
      DECISION_MODEL: ${DECISION_MODEL:-gemma4:e2b}   # stage 2 — text only is fine
      EXTRA_MODELS: ${EXTRA_MODELS:-}                 # optional, pre-pull for comparison
      THRESHOLD: ${THRESHOLD:-0.8}
      TEMPERATURE: ${TEMPERATURE:-0}
      MAX_DIM: ${MAX_DIM:-1536}
      PORT: 8080
      # Load handling
      CLASSIFY_CONCURRENCY: ${CLASSIFY_CONCURRENCY:-1}
      QUEUE_MAX: ${QUEUE_MAX:-32}
      QUEUE_WAIT_MS: ${QUEUE_WAIT_MS:-60000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-180000}
      # Access. Dev default is open + overrides ON so the demo UI's model and
      # prompt controls work. Both flip for production — see docker-compose.prod.yml.
      API_TOKEN: ${API_TOKEN:-}
      ALLOW_OVERRIDES: ${ALLOW_OVERRIDES:-true}
      SERVE_UI: ${SERVE_UI:-true}
      # Where Ollama runs. Default = inside this container (CPU).
      # Apple Silicon GPU: run Ollama natively on the Mac and set (in .env)
      #   OLLAMA_URL=http://host.docker.internal:11434
      # The entrypoint then auto-detects the external host and skips the local Ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
    volumes:
      - ollama-models:/root/.ollama # persist downloaded models across restarts
      # Live-editable at runtime (source of truth for prompts + UI):
      - ./prompts:/app/prompts:ro
      - ./ui:/app/public:ro
    ports:
      - "${BOUNCER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  ollama-models:
